<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *
        {
            font-family: Arial, Helvetica, sans-serif;
        }

        header
        {
            top: 0;
            left: 0;
            text-align: center;
            width: 100%;
            background-image: radial-gradient(circle, white,#1f1f1f);
            position: absolute;
        }

        footer
        {
            display: flex;
            bottom: 0;
            left: 0;
            position: fixed;
            height: 100px;
            width: 100%;
            background-color: #1f1f1f;
            color: rgb(226, 226, 226);
            align-items: center;
            justify-content: center;
        }
        
        h2
        {
            margin-top: 80px;
        }
        
        body {
            display: flex;
            flex-direction: column;
        }

        .painel
        {
            display: flex;
            justify-content: center;
            flex-direction: row;
            flex-wrap: wrap;
        }

        .card
        {
            margin: 10px;
            padding: 0;
            border-radius: 10px;
            background-color: rgb(238, 238, 238);
            width: 280px;
            overflow: hidden;
            box-shadow: 0px 8px 10px rgba(0, 0, 0, 0.25);
            transition: transform 1s;
        }

        .card:hover
        {
            transform: scale(1.1);
        }

        .card img
        {       
            width: 100%;
            height: 179px;
            border-bottom: 1px solid black;
        }

        .card h4
        {
            margin: 0;
            margin-bottom: 10px;
            padding: 0;
        }

        .card label
        {
            display: flex;
            justify-content: center;
        }

        h2
        {
            text-align: center;
        }

        a
        {
            text-align: center;
        }
        

    </style>
</head>
<body>

    <header>
        <img src="./IMG-20260807-WA0039.png" width="80px">
    </header>

    <h2>Cursos</h2>
    <div class="painel">
        <div class="card">
            <img src="https://uniateneu.edu.br/wp-content/uploads/2026/08/Curso-de-Enfermagem-1-scaled.jpg" alt="">
            <h4>Curso de Enfermagem</h3>
            <label for="preco">R$ 300,99</label>
        </div>

        <div class="card">
            <img src="https://blog.escolasaopelegrino.com.br/wp-content/uploads/2018/09/231114-curso-profissionalizante-de-contabilidade-vale-a-pena.jpg" alt="">
            <h4>Curso de Contabilidade</h3>
            <label for="preco">R$ 473,99</label>
        </div>

        <div class="card">
            <img src="https://wordpress-cms-revista-prod-assets.quero.space/legacy_posts/post_images/34558/096863cc0565fd5c0d251b85f6a29d15e4223433.jpg" alt="">
            <h4>Curso de Biologia</h3>
            <label for="preco">R$ 593,99</label>
        </div>

        <div class="card">
            <img src="https://www.sesc-sc.com.br/Manager/show_image.php?show_arquivo=institucional&show_campo=institucional_imagem_pq&show_chave=Institucional_id=3649" alt="">
            <h4>Curso de Informatica</h3>
            <label for="preco">R$ 369,99</label>
        </div>
    </div>
    <a href="pag1.html">Área de estudos</a>

    <footer>Eleva 2026 Copyright @</footer>
</body>
</html>
