<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *
        {
            font-family: Arial, Helvetica, sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
        }

        .painel
        {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        .card
        {
            margin: 0;
            padding: 0;
            border-radius: 10px;
            background-color: rgb(238, 238, 238);
            width: 280px;
            overflow: hidden;
            margin-right: 20px;
            
        }

        .card img
        {       
            width: 100%;
            height: 179px;
        }

        .card h4
        {
            margin: 0;
            margin-bottom: 10px;
            padding: 0;
        }

        .card label
        {
            display: flex;
            justify-content: center;
        }

        

    </style>
</head>
<body>
    <h2>Cursos</h2>
    <div class="painel">
        <div class="card">
            <img src="https://uniateneu.edu.br/wp-content/uploads/2026/08/Curso-de-Enfermagem-1-scaled.jpg" alt="">
            <h4>Curso de Enfermagem</h3>
            <label for="preco">R$ 300,99</label>
        </div>

        <div class="card">
            <img src="https://blog.escolasaopelegrino.com.br/wp-content/uploads/2018/09/231114-curso-profissionalizante-de-contabilidade-vale-a-pena.jpg" alt="">
            <h4>Curso de Contabilidade</h3>
            <label for="preco">R$ 473,99</label>
        </div>

        <div class="card">
            <img src="https://wordpress-cms-revista-prod-assets.quero.space/legacy_posts/post_images/34558/096863cc0565fd5c0d251b85f6a29d15e4223433.jpg" alt="">
            <h4>Curso de Biologia</h3>
            <label for="preco">R$ 593,99</label>
        </div>
    </div>
</body>
</html>
